name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the test from the GitHub website

# Cancel previous running builds when new code is pushed to prevent queue bottlenecks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Restore Auth Storage State
        run: |
          node -e '
            const fs = require("fs");
            let state = process.env.SF_STORAGE_STATE;
            if (state && state.trim().length > 10) {
              state = state.trim();
              // Check if base64 encoded
              if (!state.startsWith("{") && !state.startsWith("[") && state.length > 50) {
                try {
                  const decoded = Buffer.from(state, "base64").toString("utf8");
                  if (decoded.startsWith("{") || decoded.startsWith("[")) {
                    state = decoded;
                    console.log("Decoded SF_STORAGE_STATE from Base64 successfully.");
                  }
                } catch (e) {
                  // Not base64, proceed with raw string
                }
              }
              try {
                const parsed = JSON.parse(state);
                const cookieCount = parsed.cookies ? parsed.cookies.length : 0;
                const originCount = parsed.origins ? parsed.origins.length : 0;
                fs.mkdirSync(".auth", { recursive: true });
                fs.writeFileSync(".auth/sf-admin.json", JSON.stringify(parsed, null, 2));
                console.log(`Successfully restored auth session from secret (${state.length} bytes, ${cookieCount} cookies, ${originCount} origins).`);
              } catch (parseErr) {
                console.error("ERROR: SF_STORAGE_STATE secret could not be parsed as valid JSON: " + parseErr.message);
                process.exit(1);
              }
            } else {
              console.warn("WARNING: SF_STORAGE_STATE secret is not set or empty. Fresh login will be attempted.");
            }
          '
        env:
          SF_STORAGE_STATE: ${{ secrets.SF_STORAGE_STATE }}

      - name: Run Playwright Tests
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://qa.scriptureforge.org/' }}
          SF_EMAIL: ${{ secrets.SF_EMAIL }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOTP_SECRET: ${{ secrets.SF_TOTP_SECRET }}
          SF_PROJECT_NAME: ${{ secrets.SF_PROJECT_NAME || 'ETL' }}
          SF_PROJECT_DELETE_CONFIRM: ${{ secrets.SF_PROJECT_DELETE_CONFIRM || 'EnglishToTamil' }}
        run: npx playwright test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
