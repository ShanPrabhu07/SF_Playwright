name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the test from the GitHub website

# Cancel previous running builds when new code is pushed to prevent queue bottlenecks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Restore Auth Storage State
        run: |
          if [ -n "$SF_STORAGE_STATE" ]; then
            mkdir -p .auth
            echo "$SF_STORAGE_STATE" > .auth/sf-admin.json
            echo "Successfully restored auth session from secret."
          else
            echo "SF_STORAGE_STATE secret not set. Skipping restoration."
          fi
        env:
          SF_STORAGE_STATE: ${{ secrets.SF_STORAGE_STATE }}

      - name: Run Playwright Tests
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL || 'https://qa.scriptureforge.org/' }}
          SF_EMAIL: ${{ secrets.SF_EMAIL }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOTP_SECRET: ${{ secrets.SF_TOTP_SECRET }}
          SF_PROJECT_NAME: ${{ secrets.SF_PROJECT_NAME || 'ETL' }}
          SF_PROJECT_DELETE_CONFIRM: ${{ secrets.SF_PROJECT_DELETE_CONFIRM || 'EnglishToTamil' }}
        run: npx playwright test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
